    text: >-
      Cinematic oil painting capturing a surreal, folkloric gypsy caravan night
      scene. In the foreground, a frightened hare runs through a moonlit meadow
      next to a dark, ominous forest. In the midground, silhouette figures with
      heavily tattooed arms stand around a dying campfire, from which smoke
      mixed with stolen chicken feathers rises towards a starry sky. Moody,
      dramatic chiaroscuro lighting with deep indigo shadows and warm, fiery
      amber glow from the embers. Rich textures, poetic and melancholic
      atmosphere.
