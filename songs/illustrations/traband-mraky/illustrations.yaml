    text: >-
      Cinematic photorealistic scene of three generations symbolized in one
      quiet composition: in the foreground a young man sitting alone at a desk
      in a warm office, staring out a rain-streaked window with a thoughtful,
      uncertain expression; behind him, subtly layered in the same frame, an
      older father-like figure in a factory with steel beams and hanging wires,
      and farther back a grandfather in a windswept field under heavy clouds;
      the sky above is filled with slow-moving gray clouds, evoking generational
      labor and existential searching. Soft moody lighting, muted earthy and
      industrial color palette, shallow depth of field, minimal composition, no
      text, emotional, contemplative atmosphere.
