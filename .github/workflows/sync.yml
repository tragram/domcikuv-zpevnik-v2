name: Database & Assets Sync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      allow_large_deletions:
        description: 'Allow intentional deletions above 5% after reviewing D1 (all other checks remain required)'
        type: boolean
        default: false

permissions:
  contents: write
  checks: read

concurrency:
  group: production-data-sync
  cancel-in-progress: false

jobs:
  sync-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install bootstrap dependencies
        run: pnpm install --frozen-lockfile

      # GITHUB_TOKEN pushes do not start push-triggered Actions CI. Validate
      # BEFORE committing, including full tests, typechecking and a real build.
      - name: Export, validate, and publish songs snapshot
        id: publish
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          ALLOW_LARGE_DELETIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_deletions }}
        run: pnpm exec tsx scripts/sync/run.ts publish

      # The existing Cloudflare Git integration deploys main. Observe the exact
      # pushed SHA so a failed/missing deployment cannot silently pass this job.
      - name: Wait for Cloudflare production deployment
        if: steps.publish.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_COMMIT_SHA: ${{ steps.publish.outputs.sha }}
          CLOUDFLARE_BUILD_CHECK: "${{ vars.CLOUDFLARE_BUILD_CHECK || 'Workers Builds: domcikuv-zpevnik-v2' }}"
        run: pnpm exec tsx scripts/sync/run.ts wait

      - name: Summarize failure
        if: failure()
        run: |
          echo 'Sync stopped. Inspect the failed validation, push, or deployment step. No PR needs review. Rerun after correcting the cause; use the deletion override only for intentional bulk removal.' >> "$GITHUB_STEP_SUMMARY"
